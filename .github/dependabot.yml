# Keep the CI actions (actions/checkout, actions/setup-node) up to date.
# No npm entry: package.json has zero dependencies and there is no lockfile,
# so there is nothing for Dependabot to bump there. Add one if a dependency is ever added.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
