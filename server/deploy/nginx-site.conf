# feast-sync — realtime rooms API (SSE) behind nginx. Replace sync.example.com with your domain.
# Optional: put Cloudflare (or any CDN that supports streaming) in front; restore the real client IP with set_real_ip_from.
server { listen 80; listen [::]:80; server_name sync.example.com; return 301 https://$host$request_uri; }
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name sync.example.com;
    # include your real-IP snippet here if behind a CDN
    ssl_certificate     /etc/nginx/ssl/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/sync.example.com/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 16k;
    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location ~ "^/rooms/[A-Za-z0-9_-]{8}/events$" {
        limit_req zone=feast_op burst=30 nodelay; limit_req_status 429;
        proxy_pass http://127.0.0.1:8787; proxy_http_version 1.1; proxy_set_header Connection "";
        proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s;
    }
    location = /rooms { limit_req zone=feast_new burst=5 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:8787; proxy_read_timeout 15s; }
    location / { limit_req zone=feast_op burst=60 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:8787; proxy_read_timeout 15s; }
}
